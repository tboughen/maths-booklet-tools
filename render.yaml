# Free-only graph service. Use a free workspace without a payment method.
# Review that Render lists one Free web service and no paid resources.
# Website deployments continue through the existing GitHub Pages workflow.
services:
  - type: web
    name: maths-booklet-graph-mcp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.graph-mcp
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: DOWNLOAD_SIGNING_KEY
        generateValue: true
      - key: DOWNLOAD_KEY_ID
        value: initial
      - key: GRAPH_EDITOR_URL
        value: https://tboughen.github.io/maths-booklet-tools/
      - key: MAX_DAILY_OUTPUT_BYTES
        value: "209715200"
