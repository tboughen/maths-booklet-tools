# Import this blueprint only after reviewing the provider's current price.
# Website deployments continue through the existing GitHub Pages workflow.
services:
  - type: web
    name: maths-booklet-graph-mcp
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile.graph-mcp
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: GRAPH_PUBLIC_URL
        sync: false
      - key: DOWNLOAD_SIGNING_KEY
        generateValue: true
      - key: DOWNLOAD_KEY_ID
        value: initial
      - key: GRAPH_EDITOR_URL
        value: https://tboughen.github.io/maths-booklet-tools/
      - key: MAX_DAILY_OUTPUT_BYTES
        value: "209715200"
