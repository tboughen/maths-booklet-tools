name: Graph integration checks
# Full release qualification. Dispatch it on main before a release; pull requests use quick-checks.yml.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Exact comparison baseline (missing evidence selects full checks)
        type: string
      reuse_run:
        description: Optional exact trusted prior publication for catalogue reuse (otherwise discover recent main publications)
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      website: ${{ steps.package.outputs.website }}
      service: ${{ steps.package.outputs.service }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Find the linked question-bank commit
        id: bank
        run: echo "sha=$(git rev-parse HEAD:public/bank/assets)" >> "$GITHUB_OUTPUT"
      - name: Check out the private question bank
        uses: actions/checkout@v7
        with:
          repository: tboughen/mathsdock-bank
          ref: ${{ steps.bank.outputs.sha }}
          path: public/bank/assets
          token: ${{ secrets.BANK_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: package
        name: Prepare the exact applicable qualification package
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          REUSE: ${{ inputs.reuse_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ -n "$BASE" ]; then args+=("--base=$BASE"); fi
          if [ -n "$REUSE" ]; then args+=("--reuse-run=$REUSE"); fi
          node scripts/cloudflare/pipeline.mjs prepare "${args[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: prepared-release
          path: |
            cloudflare-release/package
            cloudflare-release/evidence
          retention-days: 90
  website:
    name: ${{ matrix.check }}
    needs: prepare
    if: needs.prepare.outputs.website == 'true'
    runs-on: ubuntu-latest
    # The browser shards and the service check run 12-15 minutes on a normal day.
    timeout-minutes: 25
    # Output-sensitive checks (export fingerprints, print PNGs, layout fits) run in a pinned
    # Playwright image, so the browser build, system fonts and libraries are the same on every run
    # (improvement list L3). The tag must match @playwright/test in package.json; the digest pins
    # the exact image. scripts/ci/playwright-image.test.mjs keeps them in step.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      # Export goldens (e2e/export-goldens.spec.ts) run only where this is set.
      MATHSDOCK_PINNED_BROWSER: "1"
    strategy:
      fail-fast: false
      matrix:
        check: [units, catalogue, publisher, built, browser-1, browser-2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The container runs as root over a workspace the runner owns; let git read both checkouts.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory '*'
      - name: Find the linked question-bank commit
        id: bank
        run: echo "sha=$(git rev-parse HEAD:public/bank/assets)" >> "$GITHUB_OUTPUT"
      - name: Check out the private question bank
        uses: actions/checkout@v7
        with:
          repository: tboughen/mathsdock-bank
          ref: ${{ steps.bank.outputs.sha }}
          path: public/bank/assets
          token: ${{ secrets.BANK_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: prepared-release
          path: cloudflare-release
      # The image already holds this Playwright's Chromium at PLAYWRIGHT_BROWSERS_PATH; nothing to install.
      - name: Show the pinned browser environment
        if: startsWith(matrix.check, 'browser-') || matrix.check == 'built'
        run: |
          npx playwright --version
          ls "$PLAYWRIGHT_BROWSERS_PATH"
          fc-list : family | sort -u
      - name: Qualify the exact prepared package
        env:
          CHECK: ${{ matrix.check }}
          PLAYWRIGHT_CHANNEL: chromium
        run: node scripts/cloudflare/pipeline.mjs check "--check=$CHECK"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: check-${{ matrix.check }}
          path: cloudflare-release/evidence
          retention-days: 90
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: diagnostics-${{ matrix.check }}
          path: |
            test-results
            cloudflare-release/browser
          retention-days: 14
  service:
    needs: prepare
    if: needs.prepare.outputs.service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Find the linked question-bank commit
        id: bank
        run: echo "sha=$(git rev-parse HEAD:public/bank/assets)" >> "$GITHUB_OUTPUT"
      - name: Check out the private question bank
        uses: actions/checkout@v7
        with:
          repository: tboughen/mathsdock-bank
          ref: ${{ steps.bank.outputs.sha }}
          path: public/bank/assets
          token: ${{ secrets.BANK_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r scripts/diagram-consumption-requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: prepared-release
          path: cloudflare-release
      - run: node scripts/cloudflare/pipeline.mjs check --check=service
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: check-service
          path: cloudflare-release/evidence
          retention-days: 90
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: checked-service
          path: cloudflare-release/service-package
          retention-days: 90
  release-qualification:
    name: release-qualification
    if: always()
    needs: [prepare, website, service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Find the linked question-bank commit
        id: bank
        run: echo "sha=$(git rev-parse HEAD:public/bank/assets)" >> "$GITHUB_OUTPUT"
      - name: Check out the private question bank
        uses: actions/checkout@v7
        with:
          repository: tboughen/mathsdock-bank
          ref: ${{ steps.bank.outputs.sha }}
          path: public/bank/assets
          token: ${{ secrets.BANK_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Reject failed, cancelled or missing required jobs
        env:
          PREPARE: ${{ needs.prepare.result }}
          WEBSITE_REQUIRED: ${{ needs.prepare.outputs.website }}
          WEBSITE_RESULT: ${{ needs.website.result }}
          SERVICE_REQUIRED: ${{ needs.prepare.outputs.service }}
          SERVICE_RESULT: ${{ needs.service.result }}
        run: |
          test "$PREPARE" = success
          if [ "$WEBSITE_REQUIRED" = true ]; then test "$WEBSITE_RESULT" = success; fi
          if [ "$SERVICE_REQUIRED" = true ]; then test "$SERVICE_RESULT" = success; fi
      - uses: actions/download-artifact@v7
        with:
          name: prepared-release
          path: cloudflare-release
      - uses: actions/download-artifact@v7
        if: needs.prepare.outputs.website == 'true' || needs.prepare.outputs.service == 'true'
        with:
          pattern: check-*
          path: cloudflare-release/evidence
          merge-multiple: true
      - uses: actions/download-artifact@v7
        if: needs.prepare.outputs.service == 'true'
        with:
          name: checked-service
          path: cloudflare-release/service-package
      - name: Seal complete qualification evidence
        if: needs.prepare.outputs.website == 'true' || needs.prepare.outputs.service == 'true'
        run: node scripts/cloudflare/pipeline.mjs seal
      - uses: actions/upload-artifact@v6
        if: needs.prepare.outputs.website == 'true'
        with:
          name: qualified-release
          path: |
            cloudflare-release/package
            cloudflare-release/evidence
          retention-days: 90
      - uses: actions/upload-artifact@v6
        if: needs.prepare.outputs.service == 'true'
        with:
          name: qualified-service
          path: |
            cloudflare-release/package
            cloudflare-release/service-package
            cloudflare-release/evidence
          retention-days: 90
