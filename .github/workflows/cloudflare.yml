name: Publish MathsDock to Cloudflare
on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicitly authorised action
        type: choice
        options: [preview, production, audit]
        default: preview
      qualification_run:
        description: Successful exact qualification workflow run ID
        type: string
        required: true
      release_id:
        description: Exact reviewed release ID
        type: string
        required: true
      expected_version:
        description: Current Worker version (required for publication)
        type: string
      site_url:
        description: Exact production or existing preview origin
        type: string
        default: https://mathsdock.co.uk
        required: true
      baseline_run:
        description: Optional trusted prior publication or audit workflow run ID
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: mathsdock-cloudflare
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target == 'production' && 'mathsdock-production' || 'mathsdock-preview' }}
    steps:
      - name: Require the reviewed main workflow
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Find the linked question-bank commit
        id: bank
        run: echo "sha=$(git rev-parse HEAD:public/bank/assets)" >> "$GITHUB_OUTPUT"
      - name: Check out the private question bank
        uses: actions/checkout@v7
        with:
          repository: tboughen/mathsdock-bank
          ref: ${{ steps.bank.outputs.sha }}
          path: public/bank/assets
          token: ${{ secrets.BANK_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: inputs.target != 'audit'
        run: npx playwright install --with-deps chromium
      - name: Promote or audit the exact qualified package
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ inputs.target }}
          RUN: ${{ inputs.qualification_run }}
          RELEASE: ${{ inputs.release_id }}
          EXPECTED: ${{ inputs.expected_version }}
          SITE: ${{ inputs.site_url }}
          BASELINE: ${{ inputs.baseline_run }}
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          args=("--run=$RUN" "--release-id=$RELEASE" "--expected-version=$EXPECTED" "--site=$SITE")
          if [ -n "$BASELINE" ]; then args+=("--baseline-run=$BASELINE"); fi
          if [ "$TARGET" = preview ]; then args+=(--preview); fi
          if [ "$TARGET" = audit ]; then
            node scripts/cloudflare/promote.mjs audit --audit-inventory "${args[@]}"
          else
            node scripts/cloudflare/promote.mjs promote "${args[@]}"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: published-release
          path: cloudflare-release/publication
          retention-days: 90
      - name: Report distinct release stages
        if: always()
        run: |
          if [ -f cloudflare-release/publication/deploy-receipt.json ]; then
            cat cloudflare-release/publication/deploy-receipt.json >> "$GITHUB_STEP_SUMMARY"
          elif [ -f cloudflare-release/publication/deployment-attempt.json ]; then
            cat cloudflare-release/publication/deployment-attempt.json >> "$GITHUB_STEP_SUMMARY"
          fi
