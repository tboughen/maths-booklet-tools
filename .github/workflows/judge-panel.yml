name: Judge panel
# Shadow mode: three judges review each pull request with the Claude API and report in the job
# summary. This job is not a required check and never fails on a verdict (scripts/loop/judge.mjs).
#
# Security: this job holds ANTHROPIC_API_KEY, so it never runs pull-request code. It reads the PR
# only as a diff, and runs the judge script, rubrics, guidance and dependencies from the base
# branch, so a PR can neither read the key nor rewrite the panel that judges it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: judge-panel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  judges:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request (read as data only)
        uses: actions/checkout@v7
        with:
          path: pr
          fetch-depth: 2
          persist-credentials: false
      - name: Write the pull request diff
        run: git -C pr diff --no-renames -U12 HEAD^1 HEAD > pr.diff
      - name: Check out the trusted base-branch code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Find the judge on the base branch
        id: trusted
        run: |
          if [ -f trusted/scripts/loop/judge.mjs ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "### Judge panel: not on the base branch yet" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-node@v7
        if: steps.trusted.outputs.ready == 'true'
        with:
          node-version-file: trusted/.nvmrc
      - name: Restore the base branch's dependencies
        if: steps.trusted.outputs.ready == 'true'
        id: modules
        uses: actions/cache@v5
        with:
          path: trusted/node_modules
          key: judge-modules-${{ runner.os }}-${{ hashFiles('trusted/package-lock.json') }}
      - if: steps.trusted.outputs.ready == 'true' && steps.modules.outputs.cache-hit != 'true'
        working-directory: trusted
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Run the judge panel
        if: steps.trusted.outputs.ready == 'true'
        working-directory: trusted
        run: node scripts/loop/judge.mjs --diff=../pr.diff --out=../review-shadow.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Keep the verdicts
        if: always() && hashFiles('review-shadow.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: judge-panel
          path: review-shadow.json
          retention-days: 90
  # Phase 2 auto-merge (docs/AUTONOMOUS-LOOP-POLICY.md, unanimous-pass rule). Only loop/ branches
  # from this repository, only while the repository variable MATHSDOCK_LOOP_ENABLED is "true".
  # It queues GitHub auto-merge, so the merge still waits for the required `checks` job, or labels
  # the PR loop:needs-tim. Like the judges, it never runs pull-request code: it reads the PR with
  # git and runs the decision script from the base branch.
  auto-merge:
    needs: judges
    if: ${{ !cancelled() && needs.judges.result == 'success' && vars.MATHSDOCK_LOOP_ENABLED == 'true' && startsWith(github.head_ref, 'loop/') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the pull request (read as data only)
        uses: actions/checkout@v7
        with:
          path: pr
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the trusted base-branch code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Fetch the judges' verdicts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: judge-panel
      - uses: actions/setup-node@v7
        with:
          node-version-file: trusted/.nvmrc
      - name: Decide
        id: decide
        if: ${{ hashFiles('trusted/scripts/loop/merge-decision.mjs') != '' }}
        run: node trusted/scripts/loop/merge-decision.mjs --pr=pr --review=review-shadow.json
        env:
          MATHSDOCK_LOOP_ENABLED: ${{ vars.MATHSDOCK_LOOP_ENABLED }}
          LOOP_AUTO_TIERS: T0,T1
      - name: Queue auto-merge
        if: ${{ steps.decide.outputs.merge == 'true' }}
        run: gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - name: Send to Tim
        if: ${{ steps.decide.outputs.merge == 'false' }}
        run: gh pr edit "$PR" --add-label loop:needs-tim --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
