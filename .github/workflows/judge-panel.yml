name: Judge panel
# Shadow mode: three judges review each pull request with the Claude API and report in the job
# summary. This job is not a required check and never fails on a verdict (scripts/loop/judge.mjs).
#
# Security: this job holds ANTHROPIC_API_KEY, so it never runs pull-request code. It reads the PR
# only as a diff, and runs the judge script, rubrics, guidance and dependencies from the base
# branch, so a PR can neither read the key nor rewrite the panel that judges it.
#
# Spend (11 November 2026): loop/ pull requests are judged in full on every push, because
# auto-merge reads the panel's latest verdict. Any other pull request is judged in full when it
# opens ready or is marked ready for review; after that, a push sends only the files whose
# changes differ from the last judged commit, and nothing when none do (a merge from main). Each
# run records its cost as a judge-cost-<dollars> artifact, and no judge runs once this month's
# spend reaches the cap in scripts/loop/config.json.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: read
concurrency:
  group: judge-panel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  judges:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request (read as data only)
        uses: actions/checkout@v7
        with:
          path: pr
          fetch-depth: 2
          persist-credentials: false
      - name: Write the pull request diff
        run: git -C pr diff --no-renames -U12 HEAD^1 HEAD > pr.diff
      - name: Check out the trusted base-branch code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Find the judge on the base branch
        id: trusted
        run: |
          if [ -f trusted/scripts/loop/judge.mjs ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "### Judge panel: not on the base branch yet" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/setup-node@v7
        if: steps.trusted.outputs.ready == 'true'
        with:
          node-version-file: trusted/.nvmrc
      - name: Restore the base branch's dependencies
        if: steps.trusted.outputs.ready == 'true'
        id: modules
        uses: actions/cache@v5
        with:
          path: trusted/node_modules
          key: judge-modules-${{ runner.os }}-${{ hashFiles('trusted/package-lock.json') }}
      - if: steps.trusted.outputs.ready == 'true' && steps.modules.outputs.cache-hit != 'true'
        working-directory: trusted
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Check this month's judge spend
        if: steps.trusted.outputs.ready == 'true'
        id: budget
        continue-on-error: true
        working-directory: trusted
        run: |
          month=$(date -u +%Y-%m)
          gh run list --repo "$GITHUB_REPOSITORY" --workflow judge-panel.yml --limit 1000 --created ">=$month-01" --json databaseId,workflowName,createdAt,conclusion > "$RUNNER_TEMP/runs-panel.json"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow judge-calibration.yml --limit 100 --created ">=$month-01" --json databaseId,workflowName,createdAt,conclusion > "$RUNNER_TEMP/runs-calibration.json"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow prompt-evals.yml --limit 100 --created ">=$month-01" --json databaseId,workflowName,createdAt,conclusion > "$RUNNER_TEMP/runs-evals.json"
          jq -s 'add' "$RUNNER_TEMP"/runs-*.json > "$RUNNER_TEMP/runs.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq "[.artifacts[] | select((.name | startswith(\"judge-cost-\")) and (.created_at | startswith(\"$month\"))) | {name, run: .workflow_run.id}]" | jq -s 'add // []' > "$RUNNER_TEMP/costs.json"
          spent=$(node scripts/loop/spend.mjs "--runs=$RUNNER_TEMP/runs.json" "--costs=$RUNNER_TEMP/costs.json")
          cap=$(jq -r .monthlySpendCapUSD scripts/loop/config.json)
          echo "spent=$spent" >> "$GITHUB_OUTPUT"
          if node -e "process.exit(Number(process.argv[1]) < Number(process.argv[2]) ? 1 : 0)" "$spent" "$cap"; then
            echo "over=true" >> "$GITHUB_OUTPUT"
            echo "### Judge panel: not run, monthly cap reached" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This month's judge spend is \$$spent, at or over the \$$cap cap in scripts/loop/config.json." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # A follow-up review for a pull request that is not a loop PR: compare the pull request's own
      # changes at the last commit the judges reviewed with its changes now (both from the compare
      # API, base...head), so only files that changed since then are sent.
      - name: Find the last judged commit
        if: steps.trusted.outputs.ready == 'true' && steps.budget.outputs.over != 'true' && github.event.action == 'synchronize' && !startsWith(github.head_ref, 'loop/')
        id: last
        continue-on-error: true
        run: |
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow judge-panel.yml --branch "$HEAD_REF" --status success --limit 20 --json databaseId,headSha --jq '.[] | "\(.databaseId):\(.headSha)"'); do
            id=${run%%:*}; sha=${run#*:}
            [ "$sha" = "$HEAD_SHA" ] && continue
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -qx judge-reviewed; then
              gh api -H "Accept: application/vnd.github.diff" "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$sha" > "$RUNNER_TEMP/previous.diff"
              gh api -H "Accept: application/vnd.github.diff" "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/current.diff"
              echo "args=--previous=$RUNNER_TEMP/previous.diff --current=$RUNNER_TEMP/current.diff" >> "$GITHUB_OUTPUT"
              echo "Follow-up review against $sha" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Run the judge panel
        if: steps.trusted.outputs.ready == 'true' && steps.budget.outputs.over != 'true'
        id: judge
        working-directory: trusted
        run: node scripts/loop/judge.mjs --diff=../pr.diff --out=../review-shadow.json $FOLLOW_UP
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOLLOW_UP: ${{ steps.last.outputs.args }}
      - name: Keep the verdicts
        if: always() && hashFiles('review-shadow.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: judge-panel
          path: review-shadow.json
          retention-days: 90
      # The artifact's name carries the run's cost, so spend.mjs reads it from a listing.
      - name: Record the cost
        if: always() && steps.judge.outputs.cost != ''
        uses: actions/upload-artifact@v6
        with:
          name: judge-cost-${{ steps.judge.outputs.cost }}
          path: review-shadow.json
          retention-days: 90
      # Marks a run whose judges gave a verdict (or found nothing changed): the next follow-up
      # review compares against this run's commit.
      - name: Mark the commit as reviewed
        if: always() && steps.judge.outputs.reviewed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: judge-reviewed
          path: review-shadow.json
          retention-days: 90
