name: Nightly qualification
# Improvement list L53 (Tim, 8 Nov 2026): every night, if main has changed since the last
# successful full release qualification, dispatch "Graph integration checks" on main as
# qualification only. It keeps release evidence fresh and catches flaky tests early. It never
# publishes: publishing stays a separate, hand-dispatched step that needs Tim's go-ahead.
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: nightly-qualification
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch qualification if main changed
        env:
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$MAIN" --jq .sha)
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow graph-checks.yml --branch "$MAIN" --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          # Never start one that would cancel a qualification already running (its concurrency group cancels in progress).
          busy=$( { gh run list --repo "$GITHUB_REPOSITORY" --workflow graph-checks.yml --status in_progress --json databaseId --jq length
                    gh run list --repo "$GITHUB_REPOSITORY" --workflow graph-checks.yml --status queued --json databaseId --jq length; } | awk '{s+=$1} END {print s+0}')
          if [ "$head" = "$last" ]; then echo "main ($head) is already qualified." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "$busy" != "0" ]; then echo "A qualification is already running; not starting another." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh workflow run graph-checks.yml --repo "$GITHUB_REPOSITORY" --ref "$MAIN"
          echo "Dispatched qualification of $MAIN at $head (last qualified: ${last:-none})." >> "$GITHUB_STEP_SUMMARY"
